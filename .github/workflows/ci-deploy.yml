name: CI / Deploy

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: firebase-prod-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run build

  deploy:
    name: Deploy to Firebase
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Enable webframeworks experiment
        run: firebase experiments:enable webframeworks

      # The Work section reads the studio's projects from Cadence with its read key.
      # Astro bakes it into the server bundle from .env at build time (the deploy builds).
      - name: Cadence read key
        run: |
          if [ -z "$CADENCE_READ_KEY" ]; then
            echo "::error::The CADENCE_READ_KEY secret is missing: the Work section would deploy empty."
            exit 1
          fi
          printf 'CADENCE_READ_KEY=%s\n' "$CADENCE_READ_KEY" > .env
        env:
          CADENCE_READ_KEY: ${{ secrets.CADENCE_READ_KEY }}

      - name: Deploy
        run: firebase deploy --only hosting --project prod --non-interactive --token "$FIREBASE_TOKEN"
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
